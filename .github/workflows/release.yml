name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
  image:
    needs: release
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t "$IMAGE:$GITHUB_REF_NAME-${{ matrix.arch }}" .
      - run: docker push "$IMAGE:$GITHUB_REF_NAME-${{ matrix.arch }}"
      - run: docker save "$IMAGE:$GITHUB_REF_NAME-${{ matrix.arch }}" | gzip > "${GITHUB_REPOSITORY#*/}-$GITHUB_REF_NAME-${{ matrix.arch }}.tar.gz"
      - run: gh release upload "$GITHUB_REF_NAME" "${GITHUB_REPOSITORY#*/}-$GITHUB_REF_NAME-${{ matrix.arch }}.tar.gz"
        env:
          GH_TOKEN: ${{ github.token }}
  manifest:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            -t "$IMAGE:$GITHUB_REF_NAME" -t "$IMAGE:latest" \
            "$IMAGE:$GITHUB_REF_NAME-amd64" "$IMAGE:$GITHUB_REF_NAME-arm64"
